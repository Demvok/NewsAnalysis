services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres-db
    environment:
      POSTGRES_DB: news
      POSTGRES_USER: news
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d news"]
      interval: 5s
      timeout: 5s
      retries: 5

  data-storage:
    build: ./data-storage
    container_name: data-storage
    environment:
      DATABASE_URL: postgresql+psycopg://news:${POSTGRES_PASSWORD:-POSTGRES_PASSWORD}@postgres-db:5432/news
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]

  data-ingestion:
    build: ./data-ingestion
    container_name: data-ingestion
    environment:
      DATABASE_URL: postgresql+psycopg://news:${POSTGRES_PASSWORD:-POSTGRES_PASSWORD}@postgres-db:5432/news
    ports:
      - "9000:9000"
    depends_on:
      data-storage:
        condition: service_healthy

  analysis-layer:
    build: ./analysis-layer
    container_name: analysis-layer
    environment:
      DATABASE_URL: postgresql+psycopg://news:${POSTGRES_PASSWORD:-POSTGRES_PASSWORD}@postgres-db:5432/news
    ports:
      - "7000:7000"
    depends_on:
      data-storage:
        condition: service_healthy

volumes:
  postgres_data: