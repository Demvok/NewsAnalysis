services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: news-postgres
    environment:
      POSTGRES_DB: news
      POSTGRES_USER: news
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-news_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d news"]
      interval: 5s
      timeout: 5s
      retries: 5

  data-storage:
    build: ./data-storage
    container_name: news-data-storage
    environment:
      DATABASE_URL: postgresql://news:${POSTGRES_PASSWORD:-news_dev_password}@postgres:5432/news
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: