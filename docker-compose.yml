services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres-db
    environment:
      POSTGRES_DB: news
      POSTGRES_USER: news
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d news"]
      interval: 5s
      timeout: 5s
      retries: 5

  data-storage:
    build: ./data-storage
    container_name: data-storage
    environment:
      DATABASE_URL: postgresql+psycopg://news:${POSTGRES_PASSWORD:-POSTGRES_PASSWORD}@postgres-db:5432/news
      EMBEDDING_URL: ${EMBEDDING_URL:-http://host.docker.internal:1234/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-embeddinggemma-300m}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-fake_api_key}
    ports:
      - "8000:8000"
    volumes:
      - ./logs/data-storage:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]

  analysis-layer:
    build: ./analysis-layer
    container_name: analysis-layer
    environment:
      DATABASE_URL: postgresql+psycopg://news:${POSTGRES_PASSWORD:-POSTGRES_PASSWORD}@postgres-db:5432/news
      STORAGE_URL: http://data-storage:8000
      LLM_URL: ${LLM_URL:-http://host.docker.internal:1234/v1}
    ports:
      - "7000:7000"
    depends_on:
      data-storage:
        condition: service_healthy
    volumes:
      - ./logs/analysis:/app/logs

volumes:
  postgres_data: