services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres-db
    environment:
      POSTGRES_DB: news
      POSTGRES_USER: news
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d news"]
      interval: 5s
      timeout: 5s
      retries: 5

  data-storage:
    build: ./data-storage
    container_name: data-storage
    env_file:
      - ./data-storage/app/.env
    environment:
      DATABASE_URL: postgresql+psycopg://news:${POSTGRES_PASSWORD:-POSTGRES_PASSWORD}@postgres-db:5432/news
    ports:
      - "8000:8000"
    volumes:
      - ${LOGS_DIR:-./logs}/data-storage:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]

  analysis-layer:
    build: ./analysis-layer
    container_name: analysis-layer
    env_file:
      - ./analysis-layer/app/.env
    ports:
      - "7000:7000"
    depends_on:
      data-storage:
        condition: service_healthy
    volumes:
      - ${LOGS_DIR:-./logs}/analysis:/app/logs

  management-service:
    build: ./management-service
    container_name: management-service
    env_file:
      - ./management-service/.env
    ports:
      - "9000:9000"
    volumes:
      - management_data:/app/data
      - ${LOGS_DIR:-./logs}/management-service:/var/log/newsanalysis/management-service
      - ${LOGS_DIR:-./logs}/analysis:/var/log/newsanalysis/analysis:ro
      - ${LOGS_DIR:-./logs}/data-storage:/var/log/newsanalysis/data-storage:ro
    depends_on:
      data-storage:
        condition: service_healthy
      analysis-layer:
        condition: service_started

  benchmark-service:
    build: ./benchmark-service
    container_name: benchmark-service
    environment:
      BENCHMARK_LLM_URL: ${BENCHMARK_LLM_URL:-http://host.docker.internal:1234/v1}
    ports:
      - "7100:7100"
    volumes:
      - benchmark_results:/app/results
    depends_on:
      - analysis-layer

  management-dashboard:
    build: ./management-service/dashboard
    container_name: management-dashboard
    ports:
      - "${DASHBOARD_PORT:-3001}:80"
    depends_on:
      - management-service

  visualisation-service:
    build: ./visualisation-service
    container_name: visualisation-service
    ports:
      - "${VISUALISATION_PORT:-3002}:80"
    depends_on:
      data-storage:
        condition: service_healthy

volumes:
  postgres_data:
  management_data:
  benchmark_results: